name: Deploy NOP

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Run tests
        run: uv run pytest

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push NOP image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/m8_team:nop

      - name: Deploy to NOP via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TIMEWEB_HOST }}
          username: ${{ secrets.TIMEWEB_USER }}
          key: ${{ secrets.TIMEWEB_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            docker pull ghcr.io/${{ github.repository_owner }}/m8_team:nop
            docker stop m8-nop || true
            docker rm m8-nop || true
            docker run -d \
              --name m8-nop \
              --restart unless-stopped \
              -p 8502:8080 \
              --env-file /opt/m8/nop.env \
              ghcr.io/${{ github.repository_owner }}/m8_team:nop
