name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["feature/**", "main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install deps
        run: uv sync --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: MyPy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest