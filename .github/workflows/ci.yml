name: Run CI

on:
  push:
    branches:
      - "feature/**"

  pull_request:
    branches:
      - "main"
      - "staging"
      - "develop"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run ruff
        run: |
          uv run ruff check .

      - name: Run mypy
        run: |
          uv run mypy src

      - name: Run pytest
        run: |
          uv run pytest