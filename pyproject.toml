[project]
name = "m8_team"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit==1.34.0",
    "firebase-admin==6.4.0",
    "streamlit-authenticator==0.3.1",
    "streamlit-echarts==0.4.0",
    "streamlit-option-menu==0.3.6",
    "python-dotenv==1.0.1"
]

[build-system]
requires = ["uv-build"]
build-backend = "uv_build"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "ruff>=0.15.10",
]
